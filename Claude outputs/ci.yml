name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://jdr:jdr@localhost:5432/jdr_test?sslmode=disable

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jdr
          POSTGRES_PASSWORD: jdr
          POSTGRES_DB: jdr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatage (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers à formater avec gofmt :"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -p 1 : les paquets partagent la même base de test, ils ne doivent pas
      # tourner en parallèle (chaque paquet la vide au démarrage).
      # -race : détecte les accès concurrents (hub WebSocket notamment).
      - name: Tests (avec détecteur de concurrence)
        run: go test -race -count=1 -p 1 -coverprofile=coverage.out ./...

      - name: Couverture
        run: |
          echo "### Couverture backend" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Version figée : la v2 n'accepte plus le format de .golangci.yml.
          version: v1.64.8
          working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  e2e:
    name: Bout en bout (MJ + joueur)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jdr
          POSTGRES_PASSWORD: jdr
          POSTGRES_DB: jdr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build du serveur
        run: cd backend && go build -o ../jdr-server ./cmd/server

      - name: Démarrage de l'application
        env:
          DATABASE_URL: postgres://jdr:jdr@localhost:5432/jdr_e2e?sslmode=disable
          STATIC_DIR: ${{ github.workspace }}/frontend/dist
          SESSION_SECRET: e2e-secret-e2e-secret-e2e-secret-00
        run: |
          mkdir -p e2e-data && cd e2e-data
          nohup ../jdr-server > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "Le serveur n'a pas démarré :"; cat ../server.log; exit 1

      - name: Installation de Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        working-directory: e2e
        run: npx playwright test

      - name: Journal du serveur
        if: failure()
        run: cat server.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy-scripts:
    name: Scripts de déploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/proxmox/*.sh deploy/runner/*.sh deploy/release/*.sh
